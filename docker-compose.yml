version: '3.9'

services:
  backend:
    build: ./backend
    container_name: sensight_bin-backend
    ports:
      - "${BACKEND_PORT}:3000"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=${NODE_ENV}
      - MONGO_URL=${MONGO_URL}
      - AI_URL=${AI_URL}
    # volumes:
    #   - ./backend:/app

  ai:
    build: ./ai
    container_name: sensight_bin-ai
    ports:
      - "${AI_PORT}:8000"
    depends_on:
      - backend
      - mongodb
    environment:
      - MONGO_URL=${MONGO_URL}
    # volumes:
    #   - ./ai:/app

  frontend:
    build: ./frontend
    container_name: sensight_bin-frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend

  mongodb:
    image: mongo:7
    container_name: sensight_bin-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express
    container_name: sensight_bin-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: ${MONGO_URL}
      ME_CONFIG_MONGODB_SERVER: ${MONGO_HOST}
      ME_CONFIG_MONGODB_PORT: ${MONGO_PORT}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    depends_on:
      - mongodb

volumes:
  mongo-data:
